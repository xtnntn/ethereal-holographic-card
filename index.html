<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c0a12" />
<title>ETHEREAL · Holographic Card</title>
<style>
  *, *::before, *::after {box-sizing:border-box;}
  html, body {margin:0;width:100%;height:100%;overflow:hidden;}
  body {
    background:radial-gradient(ellipse 65% 75% at 50% 48%,#201526 0%,#14101d 54%,#0c0a12 100%);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;min-height:100dvh;
    -webkit-user-select:none;user-select:none;
  }
  .stage {
    width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;
    perspective:1250px;
  }
  .card-shell {
    position:relative;
    width:min(580px,calc(100vw - 64px),calc((100dvh - 72px) * 2 / 3));
    max-height:calc(100dvh - 72px);
    aspect-ratio:2/3;
    border-radius:14px;
    transform-style:preserve-3d;
    will-change:transform;
    cursor:grab;
    touch-action:none;
    isolation:isolate;
    outline:none;
    box-shadow:0 34px 85px rgba(0,0,0,.68),0 10px 30px rgba(0,0,0,.36),0 0 55px rgba(192,70,164,.12);
  }
  .card-shell.dragging{cursor:grabbing;box-shadow:0 40px 100px rgba(0,0,0,.70),0 0 65px rgba(206,62,146,.16);}
  .card-shell:focus-visible{outline:2px solid #c0b4e5;outline-offset:5px;}
  .card-face{position:absolute;inset:0;border-radius:13px;overflow:hidden;transform:translateZ(1px);background:#bab4d4;backface-visibility:hidden;}
  .card-face::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:13px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.49),inset 0 0 0 4px rgba(17,10,25,.16),inset 0 0 20px rgba(28,11,36,.15);}
  #cardCanvas{display:block;width:100%;height:100%;opacity:0;}
  .card-edge{position:absolute;inset:-2px;border-radius:15px;background:linear-gradient(140deg,#f6a4cf,#bdb4ed 27%,#64d8e7 58%,#f6a4cf 85%);transform:translateZ(-3px);z-index:-1;}
  @media(max-width:570px){.card-shell{width:min(calc(100vw - 42px),calc((100dvh - 58px)*2/3));}}
  @media(prefers-reduced-motion:reduce){.card-shell{transition:none;}}

  .motion-toggle{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);
    z-index:20;border:0;border-radius:999px;padding:10px 14px;
    background:rgba(20,16,29,.72);color:#f2f5ff;font:600 13px/1.1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 10px 28px rgba(0,0,0,.26), inset 0 0 0 1px rgba(255,255,255,.14);
    letter-spacing:.02em;display:none;cursor:pointer;
  }
  .motion-toggle:active{transform:translateX(-50%) scale(.98);}
  .motion-toggle[hidden]{display:none !important;}
  @media (pointer:coarse){.motion-toggle{display:flex;align-items:center;justify-content:center;}}

</style>
</head>
<body>
<main class="stage" aria-label="全息镭射卡片展示">
  <div class="card-shell" id="card" tabindex="0" aria-label="拖动卡片或倾斜手机查看动态镭射反光，方向键可调整倾斜">
    <div class="card-edge"></div>
    <div class="card-face"><canvas id="cardCanvas" width="750" height="1125" aria-label="ETHEREAL 全息镭射卡片"></canvas></div>
  </div>
  <button class="motion-toggle" id="motionToggle" type="button" hidden>启用手机姿态</button>
</main>

document.querySelector('.card-face').style.background=`url("${CARD_IMAGE}") center / 100% 100% no-repeat`;
setImage(CARD_IMAGE,true);
const config={intensity:.70,reflect:.65,maxTilt:22,mode:0,bg:1,figure:1,sparkle:1,springBack:true};
const followTilt=createTiltResponse(config.maxTilt);
let targetX=0,targetY=0,currentX=0,currentY=0,baseX=0,baseY=0,startX=0,startY=0,dragging=false,t0=performance.now();
const bound=x=>Math.min(1,Math.max(-1,x));
 card.addEventListener('pointerdown',e=>{if(e.button!==0 && e.pointerType==='mouse')return;dragging=true;card.classList.add('dragging');startX=e.clientX;startY=e.clientY;baseX=targetX;baseY=targetY;card.setPointerCapture(e.pointerId);e.preventDefault();});
 card.addEventListener('pointermove',e=>{if(!dragging)return;let rect=card.getBoundingClientRect();let width=Math.max(rect.width,180),height=Math.max(rect.height,260);targetX=bound(baseX+(e.clientX-startX)/width*2.2);targetY=bound(baseY+(e.clientY-startY)/height*2.8);});
 function endDrag(){if(!dragging)return;dragging=false;card.classList.remove('dragging');if(config.springBack && !(motion.active&&motion.ready)){targetX=0;targetY=0;}}
 card.addEventListener('pointerup',endDrag);card.addEventListener('pointercancel',endDrag);card.addEventListener('lostpointercapture',endDrag);
 card.addEventListener('keydown',e=>{let accepted=true;switch(e.key){case'ArrowLeft':targetX=bound(targetX-.15);break;case'ArrowRight':targetX=bound(targetX+.15);break;case'ArrowUp':targetY=bound(targetY-.15);break;case'ArrowDown':targetY=bound(targetY+.15);break;case'Home':targetX=targetY=0;break;default:accepted=false;}if(accepted)e.preventDefault();});
function frame(t){
 if(motion.active && motion.ready && !dragging){targetX=motion.x;targetY=motion.y;}
 const tilt=followTilt(t,targetX,targetY,dragging);currentX=tilt.x;currentY=tilt.y;
 const degX=tilt.rotateX,degY=tilt.rotateY;
 card.style.transform=`rotateX(${degX.toFixed(3)}deg) rotateY(${degY.toFixed(3)}deg)`;
 gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.09,.07,.12,1);gl.clear(gl.COLOR_BUFFER_BIT);
 gl.uniform1f(uni.uProtectLogo,protectOriginalLogo);
 gl.uniform2f(uni.uTilt,currentX,currentY);gl.uniform2f(uni.uTexel,1/texWidth,1/texHeight);
 gl.uniform1f(uni.uIntensity,config.intensity);gl.uniform1f(uni.uReflect,config.reflect);gl.uniform1f(uni.uTime,(t-t0)*.001);gl.uniform1f(uni.uBg,config.bg);gl.uniform1f(uni.uFigure,config.figure);gl.uniform1f(uni.uSparkle,config.sparkle);gl.uniform1i(uni.uMode,config.mode);
 if(imageReady && titleReady){gl.drawArrays(gl.TRIANGLE_STRIP,0,4);canvas.style.opacity='1';}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
